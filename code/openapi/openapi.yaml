openapi: 3.0.3
info:
  title: Bibliotopia API
  version: 1.0.0
  description: API contract for the Bibliotopia backend.
servers:
  - url: http://localhost:8080
tags:
  - name: Authors
  - name: Books
  - name: Users
  - name: Improvements
paths:
  /api/v1/authors:
    post:
      tags: [Authors]
      operationId: createAuthor
      summary: Create an author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorRequest'
      responses:
        '201':
          description: Author created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Authors]
      operationId: getAllAuthors
      summary: Get all authors
      responses:
        '200':
          description: Authors retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorResponse'
  /api/v1/authors/{id}:
    get:
      tags: [Authors]
      operationId: getAuthorById
      summary: Get an author by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Author found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '404':
          description: Author not found
  /api/v1/books:
    post:
      tags: [Books]
      operationId: createBook
      summary: Create a book
      parameters:
        - name: X-Timezone
          in: header
          required: true
          schema:
            type: string
          example: Europe/Kyiv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserDto'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: User with this email already exists
  /api/v1/improvements:
    get:
      tags: [Improvements]
      operationId: getAllImprovements
      summary: Get all improvements
      responses:
        '200':
          description: Improvements retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImprovementResponse'
components:
  responses:
    BadRequest:
      description: Request validation failed
  schemas:
    AuthorRequest:
      type: object
      required: [birthDate, translations]
      properties:
        birthDate:
          type: string
          format: date
        deathDate:
          type: string
          format: date
          nullable: true
        translations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AuthorTranslationRequest'
    AuthorTranslationRequest:
      type: object
      required: [firstName, lastName, description, language]
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        description:
          type: string
        language:
          type: string
          minLength: 2
          maxLength: 5
    AuthorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        birthDate:
          type: string
          format: date
        deathDate:
          type: string
          format: date
          nullable: true
        translations:
          type: array
          items:
            $ref: '#/components/schemas/AuthorTranslationResponse'
    AuthorTranslationResponse:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        description:
          type: string
        language:
          type: string
    BookRequest:
      type: object
      required: [isbn, price, translations, genres, authorIds]
      properties:
        isbn:
          type: string
        price:
          type: number
          exclusiveMinimum: 0
        translations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BookTranslationRequest'
        genres:
          type: array
          minItems: 1
          items:
            type: string
        authorIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
    BookTranslationRequest:
      type: object
      required: [title, description, language]
      properties:
        title:
          type: string
        description:
          type: string
        language:
          type: string
          minLength: 2
          maxLength: 5
    BookResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        isbn:
          type: string
        pageCount:
          type: integer
        coverImageUrl:
          type: string
          nullable: true
        price:
          type: number
        translations:
          type: array
          items:
            $ref: '#/components/schemas/BookTranslationResponse'
        genres:
          type: array
          items:
            type: string
        authorIds:
          type: array
          items:
            type: integer
            format: int64
        finalPrice:
          type: number
    BookTranslationResponse:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
    RegisterUserDto:
      type: object
      required: [firstName, lastName, email, rawPassword, birthDate, language]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        rawPassword:
          type: string
          minLength: 8
          format: password
        birthDate:
          type: string
          format: date
        language:
          type: string
    UserResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        birthDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
    ImprovementResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        type:
          type: string
        importance:
          type: integer
